<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">
  <title>Poems — Between the Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f4ee;
      --ink: #24332f;
      --muted: #777c71;
      --line: #e6e1d7;
      --green: #536e5e;
      --green-dark: #344d40;
      --card: #fffefa;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    a { color: inherit; text-decoration: none; }
    .topbar { height: 76px; border-bottom: 1px solid var(--line); }
    .topbar-inner { width: min(980px, calc(100% - 48px)); height: 100%; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 50%; color: #fff; background: var(--green); font: 19px var(--serif); }
    .brand-name { font: 600 16px var(--serif); }
    .back-link,.author-link { color: var(--green-dark); font-size: 11px; font-weight: 700; }
    .page { width: min(980px, calc(100% - 40px)); margin: auto; padding: 58px 0 75px; }
    .eyebrow { color: #9c745e; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    h1 { margin: 8px 0 8px; font: 500 clamp(34px, 5vw, 48px)/1.12 var(--serif); letter-spacing: -.7px; }
    .intro { max-width: 520px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .poem-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .poem-card { padding: 23px 24px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
    .poem-card h2 { margin: 0 0 13px; font: 500 21px var(--serif); }
    .poem-body { margin: 0; color: #6f766d; font: 13px/1.9 var(--serif); white-space: pre-line; }
    .empty-state { grid-column: 1 / -1; padding: 38px 20px; border: 1px dashed #d9d5ca; border-radius: 7px; color: var(--muted); text-align: center; font-size: 13px; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .topbar { height: 66px; }
      .topbar-inner { width: calc(100% - 30px); }
      .brand-name { font-size: 14px; }
      .back-link,.author-link { font-size: 10px; }
      .page { width: calc(100% - 30px); padding-top: 40px; }
      .page-heading { align-items: start; flex-direction: column; }
      .poem-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html#home" aria-label="Between the Lines home">
        <span class="brand-mark">b.</span><span class="brand-name">Between the Lines</span>
      </a>
      <a class="back-link" href="index.html#home">← Back to home</a>
    </div>
  </header>
  <main class="page">
    <header class="page-heading">
      <div>
        <div class="eyebrow">Words to pause with</div>
        <h1>Poems</h1>
        <p class="intro" id="poemIntro">A collection of short pieces from the author’s notebook.</p>
      </div>
      <a class="author-link" id="managePoems" href="index.html#poems" hidden>Manage poems on the homepage →</a>
    </header>
    <section class="poem-grid" id="poemGrid" aria-live="polite"></section>
  </main>
  <script src="api.js"></script>
  <script>
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }
    async function initialize() {
      const [content, session] = await Promise.all([
        window.siteApi.request("/api/public"),
        window.siteApi.refreshSession()
      ]);
      const authorName = content.authorName || "the author";
      document.title = `Poems by ${authorName} — Between the Lines`;
      document.getElementById("poemIntro").textContent = `A collection of short pieces from ${authorName}’s notebook.`;
      document.getElementById("managePoems").hidden = !(session.authenticated && session.role === "author");
      const grid = document.getElementById("poemGrid");
      grid.innerHTML = content.poems.length
        ? content.poems.map(poem => `
          <article class="poem-card">
            <h2>${escapeHtml(poem.title)}</h2>
            <p class="poem-body">${escapeHtml(poem.body)}</p>
          </article>`).join("")
        : '<p class="empty-state">There are no poems here just yet. Please check back soon.</p>';
    }
    initialize().catch(error => {
      console.error("Poems could not be loaded.", error);
      document.getElementById("poemGrid").innerHTML =
        `<p class="empty-state">${escapeHtml(error.message || "Could not load the poems. Please try again.")}</p>`;
    });
  </script>
</body>
</html>
