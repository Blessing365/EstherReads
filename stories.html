<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">
  <title>All Stories — Between the Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f4ee;
      --ink: #24332f;
      --muted: #777c71;
      --line: #e6e1d7;
      --green: #536e5e;
      --green-dark: #344d40;
      --card: #fffefa;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    a { color: inherit; text-decoration: none; }
    .topbar { height: 76px; border-bottom: 1px solid var(--line); }
    .topbar-inner { width: min(1120px, calc(100% - 48px)); height: 100%; margin: auto; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 50%; color: #fff; background: var(--green); font: 19px var(--serif); }
    .brand-name { font: 600 16px var(--serif); }
    .back-link { color: var(--green-dark); font-size: 11px; font-weight: 700; }
    .page { width: min(1120px, calc(100% - 48px)); margin: auto; padding: 58px 0 75px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    .eyebrow { color: #9c745e; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 8px 0; font: 500 clamp(34px, 5vw, 48px)/1.12 var(--serif); letter-spacing: -.7px; }
    .intro { max-width: 520px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .story-card { overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--card); transition: transform .2s, box-shadow .2s; }
    .story-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(41, 54, 43, .08); }
    .story-cover { display: block; height: 185px; position: relative; background-size: cover; background-position: center; }
    .story-cover-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .story-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(28, 39, 34, .36), transparent 70%); }
    .cover-one { background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"); }
    .cover-two { background-image: url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80"); }
    .cover-three { background-image: url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"); }
    .cover-chip { position: absolute; z-index: 1; left: 14px; bottom: 13px; border: 1px solid rgba(255,255,255,.45); border-radius: 20px; padding: 5px 9px; color: white; font-size: 9px; letter-spacing: .4px; }
    .story-info { padding: 18px 19px 17px; }
    .story-meta { display: flex; gap: 9px; align-items: center; color: #8a8d82; font-size: 9px; text-transform: uppercase; letter-spacing: .7px; }
    .story-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #e6a487; }
    .story-info h2 { margin: 9px 0 7px; font: 500 22px var(--serif); }
    .story-info p { min-height: 39px; margin: 0 0 14px; color: #7c8077; font-size: 11px; line-height: 1.65; }
    .story-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 13px; color: #85877f; font-size: 10px; }
    .story-detail-link { color: var(--green-dark); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .empty-state { grid-column: 1 / -1; padding: 38px 20px; text-align: center; border: 1px dashed #d9d5ca; border-radius: 7px; color: var(--muted); font-size: 13px; }
    @media (max-width: 800px) { .story-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .topbar { height: 66px; }
      .topbar-inner { width: calc(100% - 30px); }
      .brand-name { font-size: 14px; }
      .back-link { font-size: 10px; }
      .page { width: calc(100% - 30px); padding-top: 40px; }
      .page-heading { align-items: start; flex-direction: column; }
      .story-grid { grid-template-columns: 1fr; gap: 14px; }
      .story-card { display: grid; grid-template-columns: 36% 1fr; }
      .story-cover { height: 100%; min-height: 200px; }
      .story-info { padding: 14px; }
      .story-info h2 { font-size: 19px; }
      .story-info p { min-height: 0; }
    }
    @media (max-width: 380px) { .story-card { grid-template-columns: 1fr; } .story-cover { min-height: 145px; } }
  </style>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html#home" aria-label="Between the Lines home">
        <span class="brand-mark">b.</span><span class="brand-name">Between the Lines</span>
      </a>
      <a class="back-link" href="index.html#home">← Back to home</a>
    </div>
  </header>
  <main class="page">
    <header class="page-heading">
      <div>
        <div class="eyebrow">From the notebook</div>
        <h1>All stories</h1>
        <p class="intro">Browse the whole collection, from the most-loved reads to the newest chapters.</p>
      </div>
    </header>
    <section class="story-grid" id="storyGrid" aria-live="polite"></section>
  </main>
  <script src="api.js"></script>
  <script>
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }
    async function initialize() {
      const content = await window.siteApi.request("/api/public");
      document.title = `Stories by ${content.authorName || "the author"} — Between the Lines`;
      const stories = content.stories
        .map((story, index) => ({ story, index }))
        .sort((first, second) =>
          (second.story.ratingCount || 0) - (first.story.ratingCount || 0) || first.index - second.index
        );
      const grid = document.getElementById("storyGrid");
      grid.innerHTML = stories.length ? stories.map(({ story, index }) => `
        <article class="story-card">
          <a class="story-cover ${story.coverImage ? "" : escapeHtml(story.cover || `cover-${["one", "two", "three"][index % 3]}`)}" href="detail.html?story=${encodeURIComponent(story.id)}" aria-label="Explore ${escapeHtml(story.title)}">
            ${story.coverImage ? `<img class="story-cover-image" src="${escapeHtml(story.coverImage)}" alt="">` : ""}
            <span class="cover-chip">${escapeHtml(story.genre || "A story")}</span>
          </a>
          <div class="story-info">
            <div class="story-meta"><span>${escapeHtml(story.genre || "Story")}</span><span class="dot"></span><span>${story.chapters.length} chapters</span></div>
            <h2><a href="detail.html?story=${encodeURIComponent(story.id)}">${escapeHtml(story.title)}</a></h2>
            <p>${escapeHtml(story.description || "")}</p>
            <div class="story-footer">
              <span>${story.ratingCount ? `★ ${escapeHtml(story.averageRating)} · ${story.ratingCount} ${story.ratingCount === 1 ? "rating" : "ratings"}` : escapeHtml(story.updated || "A story in chapters")}</span>
              <a class="story-detail-link" href="detail.html?story=${encodeURIComponent(story.id)}">Explore <span aria-hidden="true">→</span></a>
            </div>
          </div>
        </article>`).join("") : '<p class="empty-state">No stories yet. Please check back soon.</p>';
    }
    initialize().catch(error => {
      console.error("Stories could not be loaded.", error);
      document.getElementById("storyGrid").innerHTML =
        `<p class="empty-state">${escapeHtml(error.message || "Could not load the stories. Please try again.")}</p>`;
    });
  </script>
</body>
</html>
